<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drive Archaeology</title>
<style>
  :root {
    --bg-primary: #f5f5f7;
    --bg-secondary: #ffffff;
    --bg-tertiary: #eceef1;
    --text-primary: #1a1a1a;
    --text-secondary: #5b6472;
    --border-primary: #d7dbe0;
    --border-secondary: #e5e8eb;
    --accent: #2f6fed;
    --accent-muted: #e8effd;
    --danger: #c0392b;
    --danger-muted: #fdecea;
    --ok: #1f8a4c;
    --ok-muted: #e8f7ee;
  }

  body.dark-mode {
    --bg-primary: #1e1e1e;
    --bg-secondary: #2d2d2d;
    --bg-tertiary: #1a1a2e;
    --text-primary: #e0e0e0;
    --text-secondary: #9ca3af;
    --border-primary: #4a5568;
    --border-secondary: #374151;
    --accent: #6b9fff;
    --accent-muted: #22314f;
    --danger: #e07a6c;
    --danger-muted: #3a2321;
    --ok: #57c489;
    --ok-muted: #1d3327;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    transition: background 0.3s ease, color 0.3s ease;
    min-height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 28px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border-primary);
    transition: background 0.3s ease, border-color 0.3s ease;
  }

  header h1 {
    margin: 0;
    font-size: 1.3rem;
  }

  header .subtitle {
    color: var(--text-secondary);
    font-size: 0.85rem;
    margin-top: 2px;
  }

  #theme-toggle {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--border-primary);
    background: var(--bg-tertiary);
    color: var(--text-primary);
    font-size: 1.1rem;
    cursor: pointer;
    transition: background 0.3s ease, border-color 0.3s ease, transform 0.3s ease;
  }

  #theme-toggle:hover {
    transform: rotate(180deg);
    background: var(--accent-muted);
  }

  main {
    max-width: 980px;
    margin: 0 auto;
    padding: 24px 20px 60px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  section {
    background: var(--bg-secondary);
    border: 1px solid var(--border-primary);
    border-radius: 10px;
    padding: 18px 20px;
    transition: background 0.3s ease, border-color 0.3s ease;
  }

  section h2 {
    margin: 0 0 12px;
    font-size: 1.02rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  section h2 small {
    font-weight: normal;
    color: var(--text-secondary);
    font-size: 0.75rem;
  }

  button {
    font-family: inherit;
    font-size: 0.85rem;
    padding: 7px 14px;
    border-radius: 6px;
    border: 1px solid var(--border-primary);
    background: var(--bg-tertiary);
    color: var(--text-primary);
    cursor: pointer;
    transition: background 0.3s ease, border-color 0.3s ease, opacity 0.2s ease;
  }

  button:hover:not(:disabled) {
    background: var(--accent-muted);
    border-color: var(--accent);
  }

  button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #ffffff;
  }

  button.primary:hover:not(:disabled) {
    opacity: 0.88;
    background: var(--accent);
  }

  .device-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .device-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border: 1px solid var(--border-secondary);
    border-radius: 8px;
    cursor: pointer;
    transition: border-color 0.3s ease, background 0.3s ease;
  }

  .device-row:hover {
    border-color: var(--accent);
  }

  .device-row.selected {
    border-color: var(--accent);
    background: var(--accent-muted);
  }

  .device-row input[type="radio"] {
    accent-color: var(--accent);
  }

  .device-main {
    font-weight: 600;
    font-size: 0.92rem;
  }

  .device-meta {
    color: var(--text-secondary);
    font-size: 0.78rem;
  }

  .empty-note {
    color: var(--text-secondary);
    font-size: 0.85rem;
    padding: 6px 2px;
  }

  .form-row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 14px;
    flex-wrap: wrap;
  }

  input[type="text"] {
    flex: 1;
    min-width: 220px;
    font-family: inherit;
    font-size: 0.88rem;
    padding: 9px 12px;
    border-radius: 6px;
    border: 1px solid var(--border-primary);
    background: var(--bg-primary);
    color: var(--text-primary);
    transition: background 0.3s ease, border-color 0.3s ease;
  }

  input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-muted);
  }

  .selected-device-banner {
    font-size: 0.82rem;
    color: var(--text-secondary);
  }

  .selected-device-banner strong {
    color: var(--text-primary);
  }

  #log-pane {
    background: var(--bg-tertiary);
    border: 1px solid var(--border-secondary);
    border-radius: 8px;
    padding: 12px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.76rem;
    line-height: 1.45;
    color: var(--text-primary);
    max-height: 360px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-all;
    transition: background 0.3s ease, border-color 0.3s ease;
  }

  .status-pill {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 600;
  }

  .status-running { background: var(--accent-muted); color: var(--accent); }
  .status-done    { background: var(--ok-muted); color: var(--ok); }
  .status-error   { background: var(--danger-muted); color: var(--danger); }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
  }

  th, td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border-secondary);
  }

  th {
    color: var(--text-secondary);
    font-weight: 600;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  td.mono {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.78rem;
  }

  a { color: var(--accent); }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg-secondary); }
  ::-webkit-scrollbar-thumb { background: var(--border-primary); border-radius: 5px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>🗄️ Drive Archaeology</h1>
    <div class="subtitle">Image old drives with ddrescue, watch it live, keep the receipts.</div>
  </div>
  <button id="theme-toggle" aria-label="Toggle dark mode">🌙</button>
</header>

<main>

  <section>
    <h2>Attached Devices <button id="refresh-devices">Refresh</button></h2>
    <div id="device-list" class="device-list">
      <div class="empty-note">Loading…</div>
    </div>

    <div class="form-row">
      <span class="selected-device-banner" id="selected-banner">No device selected.</span>
    </div>
    <div class="form-row">
      <input type="text" id="label-input" placeholder="Label for this drive (e.g. caviar2200-unicorn)" maxlength="80">
      <button class="primary" id="start-btn" disabled>Start Imaging</button>
    </div>
  </section>

  <section id="progress-section" style="display:none;">
    <h2>Live Progress <span id="job-status" class="status-pill status-running">running</span></h2>
    <div id="log-pane"></div>
  </section>

  <section>
    <h2>History <button id="refresh-history">Refresh</button></h2>
    <div id="history-wrap">
      <div class="empty-note">Loading…</div>
    </div>
  </section>

</main>

<script>
const themeToggle = document.getElementById('theme-toggle');
const body = document.body;

function applyTheme(dark) {
  body.classList.toggle('dark-mode', dark);
  themeToggle.textContent = dark ? '☀️' : '🌙';
}

const savedTheme = localStorage.getItem('app-theme');
if (savedTheme === 'light') {
  applyTheme(false);
} else {
  applyTheme(true);
  if (!savedTheme) localStorage.setItem('app-theme', 'dark');
}

themeToggle.addEventListener('click', () => {
  const nowDark = !body.classList.contains('dark-mode');
  applyTheme(nowDark);
  localStorage.setItem('app-theme', nowDark ? 'dark' : 'light');
});

// ---- Devices ----
let selectedDevice = null;
const deviceListEl = document.getElementById('device-list');
const selectedBanner = document.getElementById('selected-banner');
const labelInput = document.getElementById('label-input');
const startBtn = document.getElementById('start-btn');

function updateStartEnabled() {
  startBtn.disabled = !(selectedDevice && labelInput.value.trim().length > 0);
}
labelInput.addEventListener('input', updateStartEnabled);

async function loadDevices() {
  deviceListEl.innerHTML = '<div class="empty-note">Loading…</div>';
  try {
    const res = await fetch('/api/devices');
    const devices = await res.json();
    if (!devices.length) {
      deviceListEl.innerHTML = '<div class="empty-note">No eligible devices attached (system disks are always hidden). Plug in your adapter and hit Refresh.</div>';
      selectedDevice = null;
      updateStartEnabled();
      selectedBanner.textContent = 'No device selected.';
      return;
    }
    deviceListEl.innerHTML = '';
    devices.forEach(d => {
      const row = document.createElement('label');
      row.className = 'device-row';
      row.innerHTML = `
        <input type="radio" name="device" value="${d.path}">
        <div>
          <div class="device-main">${d.path} — ${d.model || 'unknown model'} (${d.size || '?'})</div>
          <div class="device-meta">transport: ${d.transport || '?'} · serial: ${d.serial || 'n/a'} · vendor: ${d.vendor || 'n/a'}</div>
        </div>
      `;
      const radio = row.querySelector('input');
      radio.addEventListener('change', () => {
        document.querySelectorAll('.device-row').forEach(r => r.classList.remove('selected'));
        row.classList.add('selected');
        selectedDevice = d.path;
        selectedBanner.innerHTML = `Selected: <strong>${d.path}</strong> — ${d.model || 'unknown model'} (${d.size || '?'})`;
        updateStartEnabled();
      });
      deviceListEl.appendChild(row);
    });
  } catch (err) {
    deviceListEl.innerHTML = `<div class="empty-note">Failed to load devices: ${err}</div>`;
  }
}
document.getElementById('refresh-devices').addEventListener('click', loadDevices);
loadDevices();

// ---- Start job + live stream ----
const progressSection = document.getElementById('progress-section');
const logPane = document.getElementById('log-pane');
const jobStatusEl = document.getElementById('job-status');

startBtn.addEventListener('click', async () => {
  if (!selectedDevice) return;
  const label = labelInput.value.trim();
  startBtn.disabled = true;
  startBtn.textContent = 'Starting…';
  try {
    const res = await fetch('/api/jobs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ device: selectedDevice, label })
    });
    if (!res.ok) {
      const err = await res.json();
      alert('Could not start: ' + (err.detail || res.status));
      startBtn.disabled = false;
      startBtn.textContent = 'Start Imaging';
      return;
    }
    const { job_id } = await res.json();
    watchJob(job_id);
  } catch (err) {
    alert('Could not start: ' + err);
    startBtn.disabled = false;
    startBtn.textContent = 'Start Imaging';
  }
});

function watchJob(jobId) {
  progressSection.style.display = '';
  logPane.textContent = '';
  jobStatusEl.textContent = 'running';
  jobStatusEl.className = 'status-pill status-running';
  progressSection.scrollIntoView({ behavior: 'smooth' });

  const es = new EventSource(`/api/jobs/${jobId}/stream`);
  es.onmessage = (ev) => {
    const line = JSON.parse(ev.data);
    logPane.textContent += line + '\n';
    logPane.scrollTop = logPane.scrollHeight;
  };
  es.addEventListener('done', (ev) => {
    const status = JSON.parse(ev.data);
    jobStatusEl.textContent = status;
    jobStatusEl.className = 'status-pill ' + (status === 'done' ? 'status-done' : 'status-error');
    es.close();
    startBtn.disabled = false;
    startBtn.textContent = 'Start Imaging';
    loadHistory();
  });
  es.onerror = () => {
    // EventSource auto-retries on transient drops; only bail if the job itself ended.
  };
}

// ---- History ----
async function loadHistory() {
  const wrap = document.getElementById('history-wrap');
  wrap.innerHTML = '<div class="empty-note">Loading…</div>';
  try {
    const res = await fetch('/api/history');
    const rows = await res.json();
    if (!rows.length) {
      wrap.innerHTML = '<div class="empty-note">No runs yet.</div>';
      return;
    }
    const fmtSize = (n) => {
      if (!n) return '—';
      const units = ['B','KB','MB','GB','TB'];
      let i = 0, v = n;
      while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
      return v.toFixed(1) + ' ' + units[i];
    };
    let html = '<table><thead><tr><th>Date</th><th>Label</th><th>Device</th><th>Image</th><th>SMART</th></tr></thead><tbody>';
    rows.forEach(r => {
      const dateStr = r.date && r.date.length >= 8
        ? `${r.date.slice(0,4)}-${r.date.slice(4,6)}-${r.date.slice(6,8)}`
        : (r.date || '—');
      const imageCell = r.image_exists
        ? `${fmtSize(Number(r.image_size_bytes))} <div class="empty-note" style="padding:0">${r.image_path}</div>`
        : 'missing';
      const smartCell = r.smart_exists
        ? `<a href="${r.smart_url}" target="_blank">view</a>`
        : '—';
      html += `<tr>
        <td class="mono">${dateStr}</td>
        <td>${r.label || ''}</td>
        <td class="mono">${r.device || ''}</td>
        <td class="mono">${imageCell}</td>
        <td>${smartCell}</td>
      </tr>`;
    });
    html += '</tbody></table>';
    wrap.innerHTML = html;
  } catch (err) {
    wrap.innerHTML = `<div class="empty-note">Failed to load history: ${err}</div>`;
  }
}
document.getElementById('refresh-history').addEventListener('click', loadHistory);
loadHistory();
</script>

</body>
</html>
