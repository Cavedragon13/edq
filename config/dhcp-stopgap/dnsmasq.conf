# Stopgap DHCP server on udragon (2026-10-21).
# Why: the Arris W61 stopped answering DHCP requests — devices that reconnect get 169.254.x.x.
# This hands out ONLY 192.168.7.60–99 (unused block) so it can't collide with the Arris's leases,
# and is deliberately NOT authoritative, so it never NAKs addresses the Arris gave out.
# Remove once the Arris is fixed or replaced: sudo systemctl disable --now dhcp-stopgap

port=0                      # DHCP only — Pi-hole (Docker) does DNS
interface=wlp6s0
bind-interfaces
dhcp-range=192.168.7.60,192.168.7.99,255.255.255.0,12h
dhcp-option=option:router,192.168.7.1
dhcp-option=option:dns-server,192.168.7.226,1.1.1.1
dhcp-leasefile=/var/lib/misc/dhcp-stopgap.leases
log-dhcp
