# Dragonsuite Docker Compose — Master Service Definitions
#
# Migration status: Phase 0 (foundation only)
# Services are added here as each venv is containerized.
#
# NETWORK: host mode — all services bind 0.0.0.0:<port>, reachable at 192.168.7.226:<port>
# from LAN without any port mapping config. Ollama (11434) and LM Studio (1234) on the
# host are also reachable by containers transparently.
#
# VOLUMES: bind mounts only (no named volumes) — models/cache/output must be accessible
# via SMB shares from Macs.
#
# PROFILES:
#   dashboard  — Dragonsuite dashboard (port 8100)
#   cpu        — CPU-only Python services
#   static     — Static file servers (no Python ML)
#   node       — Node.js services (DragonArt, Horse Racing)
#   gpu-light  — GPU services < ~8GB VRAM
#   gpu-heavy  — GPU services > ~8GB VRAM
#   all        — Everything
#
# USAGE:
#   Single service:  docker compose -f docker/docker-compose.yml up -d <service-id>
#   By profile:      docker compose -f docker/docker-compose.yml --profile gpu-light up -d
#   Stop service:    docker compose -f docker/docker-compose.yml stop <service-id>
#   Logs:            docker compose -f docker/docker-compose.yml logs -f <service-id>
#
# ROLLBACK: each service in dragonsuite.json has launch_command_venv as fallback.
# Change launch_command back to the venv version — no service restart needed.

# ─────────────────────────────────────────────────────────────────────────────
# REUSABLE FRAGMENTS
# ─────────────────────────────────────────────────────────────────────────────

x-gpu-deploy: &gpu-deploy
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

x-gpu-env: &gpu-env
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  HF_HOME: /root/.cache/huggingface
  GRADIO_SERVER_NAME: "0.0.0.0"

x-gpu-volumes: &gpu-volumes
  - /srv/containers/edq/cache_huggingface:/root/.cache/huggingface:rw
  - /home/edq/ai_generated:/ai_generated:rw

x-env-file: &env-file
  env_file:
    - /srv/containers/edq/.env

# ─────────────────────────────────────────────────────────────────────────────
# STATIC HTTP SERVICES  (profile: static)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Phase 1 target ──────────────────────────────────────────────────────────

  interactive-games:
    profiles: [static, all]
    image: python:3.12-slim
    network_mode: host
    working_dir: /srv
    volumes:
      - /srv/containers/edq/projects/interactive-games:/srv:ro
    command: python3 -m http.server 8031
    restart: unless-stopped

  audiomass:
    profiles: [static, all]
    image: python:3.12-slim
    network_mode: host
    working_dir: /srv
    volumes:
      - /srv/containers/edq/projects/AudioMass/src:/srv:ro
    command: python3 -m http.server 8027
    restart: unless-stopped

  mule-game:
    profiles: [static, all]
    image: python:3.12-slim
    network_mode: host
    working_dir: /srv
    volumes:
      - /srv/containers/edq/media:/srv:ro
    command: python3 -m http.server 8032
    restart: unless-stopped

