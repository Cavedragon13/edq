services:
  linkding:
    image: sissbruecker/linkding:latest
    container_name: linkding
    restart: unless-stopped
    ports:
      - "8039:9090"
    volumes:
      - /srv/containers/edq/media/linkding_data:/etc/linkding/data
    environment:
      - LD_SUPERUSER_NAME=edq
      - LD_SUPERUSER_PASSWORD=${LD_SUPERUSER_PASSWORD}
