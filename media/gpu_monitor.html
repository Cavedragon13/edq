<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPU Monitor</title>
    <link rel="icon" type="image/svg+xml" href="/media/favicon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent;
            overflow: hidden;
        }

        #monitor {
            position: fixed;
            width: 280px;
            background: rgba(30, 30, 30, 0.95);
            border: 1px solid #4a5568;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            cursor: move;
            user-select: none;
            backdrop-filter: blur(10px);
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        body.light-mode #monitor {
            background: rgba(255, 255, 255, 0.95);
            border-color: #cbd5e0;
        }

        #header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 8px 12px;
            border-radius: 8px 8px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #title {
            color: white;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #controls {
            display: flex;
            gap: 4px;
        }

        .control-btn {
            width: 20px;
            height: 20px;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        #content {
            padding: 12px;
        }

        .stat-row {
            margin-bottom: 12px;
        }

        .stat-label {
            color: #9ca3af;
            font-size: 11px;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        body.light-mode .stat-label {
            color: #6b7280;
        }

        .stat-value {
            color: #e0e0e0;
            font-size: 18px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        body.light-mode .stat-value {
            color: #1f2937;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #374151;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            margin-top: 4px;
        }

        body.light-mode .progress-bar {
            background: #e5e7eb;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981 0%, #3b82f6 50%, #8b5cf6 100%);
            border-radius: 10px;
            transition: width 0.5s ease;
            position: relative;
        }

        .progress-fill.high {
            background: linear-gradient(90deg, #f59e0b 0%, #ef4444 100%);
        }

        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 11px;
            font-weight: 600;
            color: white;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        }

        .memory-info {
            display: flex;
            justify-content: space-between;
            margin-top: 4px;
            font-size: 11px;
            color: #9ca3af;
        }

        body.light-mode .memory-info {
            color: #6b7280;
        }

        #status {
            text-align: center;
            padding: 8px;
            font-size: 11px;
            color: #6b7280;
            border-top: 1px solid #374151;
        }

        body.light-mode #status {
            color: #9ca3af;
            border-top-color: #e5e7eb;
        }

        .pulse {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #10b981;
            border-radius: 50%;
            margin-right: 4px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .error {
            color: #ef4444 !important;
        }

        .error .pulse {
            background: #ef4444;
        }
    </style>
</head>
<body>
    <div id="monitor">
        <div id="header">
            <div id="title">🎮 GPU Monitor</div>
            <div id="controls">
                <button class="control-btn" id="theme-toggle" title="Toggle theme">🌙</button>
                <button class="control-btn" id="minimize" title="Minimize">−</button>
            </div>
        </div>
        <div id="content">
            <div class="stat-row">
                <div class="stat-label">VRAM Usage</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="vram-fill" style="width: 0%;">
                        <span class="progress-text" id="vram-percent">0%</span>
                    </div>
                </div>
                <div class="memory-info">
                    <span id="vram-used">0 MB</span>
                    <span id="vram-total">0 MB</span>
                </div>
            </div>
            <div class="stat-row">
                <div class="stat-label">GPU Utilization</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="util-fill" style="width: 0%;">
                        <span class="progress-text" id="util-percent">0%</span>
                    </div>
                </div>
            </div>
        </div>
        <div id="status">
            <span class="pulse"></span>
            <span id="status-text">Initializing...</span>
        </div>
    </div>

    <script>
        const monitor = document.getElementById('monitor');
        const content = document.getElementById('content');
        const minimizeBtn = document.getElementById('minimize');
        const themeToggle = document.getElementById('theme-toggle');
        const statusText = document.getElementById('status-text');
        const vramFill = document.getElementById('vram-fill');
        const vramPercent = document.getElementById('vram-percent');
        const vramUsed = document.getElementById('vram-used');
        const vramTotal = document.getElementById('vram-total');
        const utilFill = document.getElementById('util-fill');
        const utilPercent = document.getElementById('util-percent');

        // Load saved position
        const savedX = localStorage.getItem('gpu-monitor-x') || '20';
        const savedY = localStorage.getItem('gpu-monitor-y') || '20';
        monitor.style.left = savedX + 'px';
        monitor.style.top = savedY + 'px';

        // Dragging functionality
        let isDragging = false;
        let currentX;
        let currentY;
        let initialX;
        let initialY;
        let xOffset = parseInt(savedX);
        let yOffset = parseInt(savedY);

        monitor.addEventListener('mousedown', dragStart);
        document.addEventListener('mousemove', drag);
        document.addEventListener('mouseup', dragEnd);

        function dragStart(e) {
            if (e.target.closest('.control-btn')) return;
            initialX = e.clientX - xOffset;
            initialY = e.clientY - yOffset;
            isDragging = true;
        }

        function drag(e) {
            if (!isDragging) return;
            e.preventDefault();
            currentX = e.clientX - initialX;
            currentY = e.clientY - initialY;
            xOffset = currentX;
            yOffset = currentY;
            setTranslate(currentX, currentY);
        }

        function dragEnd() {
            if (isDragging) {
                localStorage.setItem('gpu-monitor-x', xOffset);
                localStorage.setItem('gpu-monitor-y', yOffset);
            }
            isDragging = false;
        }

        function setTranslate(xPos, yPos) {
            monitor.style.left = xPos + 'px';
            monitor.style.top = yPos + 'px';
        }

        // Minimize toggle
        let isMinimized = false;
        minimizeBtn.addEventListener('click', () => {
            isMinimized = !isMinimized;
            content.style.display = isMinimized ? 'none' : 'block';
            minimizeBtn.textContent = isMinimized ? '+' : '−';
        });

        // Theme toggle
        const savedTheme = localStorage.getItem('gpu-monitor-theme');
        if (savedTheme === 'light') {
            document.body.classList.add('light-mode');
            themeToggle.textContent = '🌙';
        } else {
            themeToggle.textContent = '☀️';
            if (!savedTheme) {
                localStorage.setItem('gpu-monitor-theme', 'dark');
            }
        }

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isDark = !document.body.classList.contains('light-mode');
            themeToggle.textContent = isDark ? '☀️' : '🌙';
            localStorage.setItem('gpu-monitor-theme', isDark ? 'dark' : 'light');
        });

        // Fetch GPU stats
        async function updateStats() {
            try {
                const response = await fetch('/api/gpu-stats');
                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error);
                }

                // Update VRAM
                const vramUsedMB = data.vram_used_mb;
                const vramTotalMB = data.vram_total_mb;
                const vramPercentVal = data.vram_percent;

                vramUsed.textContent = `${vramUsedMB.toLocaleString()} MB`;
                vramTotal.textContent = `${vramTotalMB.toLocaleString()} MB`;
                vramPercent.textContent = `${vramPercentVal.toFixed(1)}%`;
                vramFill.style.width = vramPercentVal + '%';

                // Color code VRAM bar
                if (vramPercentVal > 80) {
                    vramFill.classList.add('high');
                } else {
                    vramFill.classList.remove('high');
                }

                // Update GPU utilization
                const utilPercentVal = data.gpu_utilization;
                utilPercent.textContent = `${utilPercentVal}%`;
                utilFill.style.width = utilPercentVal + '%';

                if (utilPercentVal > 80) {
                    utilFill.classList.add('high');
                } else {
                    utilFill.classList.remove('high');
                }

                // Update status
                statusText.textContent = `Updated ${new Date().toLocaleTimeString()}`;
                statusText.classList.remove('error');

            } catch (error) {
                console.error('Error fetching GPU stats:', error);
                statusText.textContent = 'Connection error';
                statusText.classList.add('error');
            }
        }

        // Update every 2 seconds
        updateStats();
        setInterval(updateStats, 2000);
    </script>
</body>
</html>
