<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="robot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="16" fill="url(#bg)"/>

  <!-- Robot body (M.U.L.E.) -->
  <g transform="translate(64, 64)">
    <!-- Body -->
    <rect x="-16" y="-12" width="32" height="24" rx="3" fill="url(#robot)"/>

    <!-- Head -->
    <rect x="-12" y="-24" width="24" height="16" rx="2" fill="url(#robot)"/>

    <!-- Eyes -->
    <circle cx="-6" cy="-18" r="2" fill="#fbbf24"/>
    <circle cx="6" cy="-18" r="2" fill="#fbbf24"/>

    <!-- Antenna -->
    <line x1="0" y1="-24" x2="0" y2="-30" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="-30" r="2" fill="#fbbf24"/>

    <!-- Arms -->
    <rect x="-22" y="-8" width="6" height="12" rx="2" fill="#8b5cf6"/>
    <rect x="16" y="-8" width="6" height="12" rx="2" fill="#8b5cf6"/>

    <!-- Legs -->
    <rect x="-12" y="12" width="8" height="14" rx="2" fill="#7c3aed"/>
    <rect x="4" y="12" width="8" height="14" rx="2" fill="#7c3aed"/>

    <!-- Feet -->
    <ellipse cx="-8" cy="26" rx="5" ry="2" fill="#6366f1"/>
    <ellipse cx="8" cy="26" rx="5" ry="2" fill="#6366f1"/>
  </g>

  <!-- Planet Irata hex grid accent -->
  <g opacity="0.3">
    <polygon points="20,20 26,16 32,20 32,28 26,32 20,28" fill="none" stroke="#fff" stroke-width="1"/>
    <polygon points="96,96 102,92 108,96 108,104 102,108 96,104" fill="none" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- M.U.L.E. text badge -->
  <rect x="4" y="104" width="44" height="18" rx="4" fill="rgba(0,0,0,0.4)"/>
  <text x="26" y="117" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fbbf24" text-anchor="middle">M.U.L.E.</text>
</svg>
