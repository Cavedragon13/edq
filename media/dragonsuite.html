<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dragonsuite — AI Command Center</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐉</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #08080e;
  --bg2:       #0d0d18;
  --bgc:       #0f0f1c;
  --bgch:      #131325;
  --bge:       #1a1a2e;
  --bd:        rgba(255,255,255,0.06);
  --bdh:       rgba(255,255,255,0.13);
  --tx:        #dde2f0;
  --tx2:       #8b8fa8;
  --txm:       #4b4f68;
  --ac:        #c084fc;
  --acd:       rgba(192,132,252,0.13);
  --run:       #34d399;
  --rund:      rgba(52,211,153,0.12);
  --err:       #f87171;
  --warn:      #fbbf24;
  --r:         10px;
  --rs:        6px;
  --tr:        0.18s ease;
}
body.light {
  --bg:   #f0f0f8; --bg2:  #e8e8f2; --bgc:  #ffffff;
  --bgch: #f8f8ff; --bge:  #e4e4f0;
  --bd:   rgba(0,0,0,0.08); --bdh: rgba(0,0,0,0.16);
  --tx:   #1a1a2e; --tx2:  #4b4f68; --txm:  #9098b8;
  --acd:  rgba(192,132,252,0.10); --rund: rgba(52,211,153,0.10);
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family:'Outfit',sans-serif;
  background:var(--bg); color:var(--tx);
  min-height:100vh;
  transition:background .3s,color .3s;
}
body::before {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(ellipse 70% 50% at 15% 0%, rgba(192,132,252,.05) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 85% 100%, rgba(52,211,153,.04) 0%, transparent 60%);
}

/* Header */
.hdr {
  position:sticky; top:0; z-index:100;
  height:56px; display:flex; align-items:center; gap:16px; padding:0 20px;
  background:rgba(8,8,14,.88); backdrop-filter:blur(20px);
  border-bottom:1px solid var(--bd);
  transition:background .3s;
}
body.light .hdr { background:rgba(240,240,248,.88); }
.logo { display:flex; align-items:center; gap:8px; text-decoration:none; flex-shrink:0; }
.logo-icon { font-size:20px; line-height:1; }
.logo-text {
  font-family:'Syne',sans-serif; font-size:1rem; font-weight:800;
  color:var(--tx); letter-spacing:.02em;
}
.logo-text em { color:var(--ac); font-style:normal; }
.sep { width:1px; height:24px; background:var(--bd); flex-shrink:0; }
.hdr-stats { display:flex; align-items:center; gap:14px; flex:1; min-width:0; }
.schip { display:flex; align-items:center; gap:7px; flex-shrink:0; }
.slbl {
  font-family:'JetBrains Mono',monospace; font-size:9.5px;
  color:var(--txm); text-transform:uppercase; letter-spacing:.08em;
}
.strack { width:72px; height:3px; background:var(--bd); border-radius:2px; overflow:hidden; }
.sfill {
  height:100%; border-radius:2px; background:var(--run);
  transition:width .6s ease;
}
.sfill.w { background:var(--warn); } .sfill.d { background:var(--err); }
.sval {
  font-family:'JetBrains Mono',monospace; font-size:10.5px;
  color:var(--tx2); font-weight:500; min-width:32px;
}
.hdr-right { display:flex; align-items:center; gap:8px; flex-shrink:0; }
.hdr-ip { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--txm); }
/* Weather chip */
.hdr-weather {
  display:flex; align-items:center; gap:7px; flex-shrink:0;
  padding:3px 10px 3px 8px; border-radius:8px;
  background:var(--bge); border:1px solid var(--bd);
  font-size:11px; color:var(--tx2); white-space:nowrap;
  transition:all var(--tr);
}
.hdr-weather img { width:22px; height:22px; flex-shrink:0; }
.hdr-weather-temp { font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:500; color:var(--tx); }
.hdr-weather-cond { color:var(--txm); font-size:10px; }
.ibtn {
  width:30px; height:30px; border-radius:7px;
  border:1px solid var(--bd); background:transparent; color:var(--tx2);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-size:13px; transition:all var(--tr); flex-shrink:0;
}
.ibtn:hover { background:var(--bge); border-color:var(--bdh); color:var(--tx); }
.ibtn.spin svg { animation:spin .7s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* Category nav */
.cnav {
  position:sticky; top:56px; z-index:90;
  display:flex; gap:0; padding:0 20px;
  background:rgba(8,8,14,.75); backdrop-filter:blur(16px);
  border-bottom:1px solid var(--bd);
  overflow-x:auto; scrollbar-width:none;
  transition:background .3s;
}
body.light .cnav { background:rgba(240,240,248,.75); }
.cnav::-webkit-scrollbar { display:none; }
.ctab {
  display:flex; align-items:center; gap:5px;
  padding:0 13px; height:42px;
  border:none; border-bottom:2px solid transparent;
  background:transparent; color:var(--txm); cursor:pointer;
  font-family:'Outfit',sans-serif; font-size:12.5px; font-weight:500;
  white-space:nowrap; transition:all var(--tr);
}
.ctab:hover { color:var(--tx2); }
.ctab.active { color:var(--tx); border-bottom-color:var(--ac); }
.cnum {
  font-size:9.5px; font-family:'JetBrains Mono',monospace;
  padding:1px 5px; border-radius:9px;
  background:var(--bge); color:var(--txm);
}
.ctab.active .cnum { background:var(--acd); color:var(--ac); }

/* Main */
.main {
  position:relative; z-index:1;
  padding:28px; max-width:1600px; margin:0 auto;
}

/* Stats cards */
.sgrid {
  display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:14px; margin-bottom:20px;
}
.sc {
  background:var(--bgc); border:1px solid var(--bd);
  border-radius:var(--r); padding:13px 15px;
}
.sc-lbl {
  font-size:9.5px; font-family:'JetBrains Mono',monospace;
  text-transform:uppercase; letter-spacing:.1em;
  color:var(--txm); margin-bottom:8px;
}
.sc-val {
  font-family:'JetBrains Mono',monospace;
  font-size:19px; font-weight:500; color:var(--tx); margin-bottom:5px;
}
.sc-bar { height:2px; background:var(--bd); border-radius:1px; overflow:hidden; }
.sc-fill { height:100%; border-radius:1px; background:var(--run); transition:width .6s ease; }
.sc-fill.w { background:var(--warn); } .sc-fill.d { background:var(--err); }
.sc-sub { font-size:10.5px; color:var(--txm); margin-top:4px; }

/* LLM row */
.llmrow {
  background:var(--bgc); border:1px solid var(--bd);
  border-radius:var(--r); padding:10px 15px;
  margin-bottom:26px;
  display:flex; align-items:flex-start; gap:14px; flex-wrap:wrap;
}
.llm-lbl {
  font-size:9.5px; font-family:'JetBrains Mono',monospace;
  text-transform:uppercase; letter-spacing:.1em;
  color:var(--txm); flex-shrink:0; padding-top:2px; min-width:56px;
}
.llm-pills { display:flex; flex-wrap:wrap; gap:5px; flex:1; }
.llm-pill {
  font-family:'JetBrains Mono',monospace; font-size:10.5px;
  padding:2px 7px; border-radius:4px;
  background:var(--bge); color:var(--tx2); border:1px solid var(--bd);
}
.llm-off { font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--txm); }

/* Service grid */
.svgrid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(264px,1fr));
  gap:14px;
}

/* Service card */
.card {
  background:var(--bgc); border:1px solid var(--bd);
  border-radius:var(--r); padding:18px;
  display:flex; flex-direction:column; gap:13px;
  position:relative; overflow:hidden;
  transition:border-color var(--tr), background var(--tr), box-shadow var(--tr);
  animation:cin .35s ease both;
}
.card::before {
  content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
  background:transparent; border-radius:10px 0 0 10px;
  transition:background var(--tr);
}
.card.run::before { background:var(--run); }
.card.run { border-color:rgba(52,211,153,.18); box-shadow:0 0 18px rgba(52,211,153,.04); }
.card:hover { border-color:var(--bdh); background:var(--bgch); }
.card.run:hover { box-shadow:0 0 26px rgba(52,211,153,.09); }
@keyframes cin { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
.svgrid.settled .card { animation:none; }

.card-hd { display:flex; align-items:flex-start; gap:10px; }
.card-ico {
  font-size:24px; line-height:1; flex-shrink:0;
  width:40px; height:40px;
  display:flex; align-items:center; justify-content:center;
  background:var(--bge); border-radius:8px;
}
.card-meta { flex:1; min-width:0; }
.card-name {
  font-family:'Syne',sans-serif; font-size:14px; font-weight:700;
  color:var(--tx); line-height:1.2; margin-bottom:4px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.cbadge {
  display:inline-flex; align-items:center;
  font-size:9.5px; font-weight:500;
  padding:2px 6px; border-radius:9px;
  text-transform:capitalize; letter-spacing:.02em;
}
.sdot { width:6px; height:6px; border-radius:50%; flex-shrink:0; margin-top:4px; }
.sdot.on { background:var(--run); box-shadow:0 0 5px var(--run); animation:blink 2s ease-in-out infinite; }
.sdot.off { background:var(--txm); }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }

.card-desc { font-size:12.5px; color:var(--tx2); line-height:1.45; }
.card-feats { display:flex; flex-wrap:wrap; gap:4px; }
.feat {
  font-size:9.5px; font-family:'JetBrains Mono',monospace;
  padding:2px 6px; border-radius:4px;
  background:var(--bge); color:var(--txm); border:1px solid var(--bd);
}
.card-ft { display:flex; align-items:center; gap:6px; margin-top:auto; flex-wrap:wrap; }
.cport {
  font-family:'JetBrains Mono',monospace;
  font-size:10px; color:var(--txm); flex:1;
}
.cport b { color:var(--tx2); font-weight:400; }

/* Buttons */
.btn {
  display:inline-flex; align-items:center; gap:4px;
  font-family:'Outfit',sans-serif; font-size:11.5px; font-weight:500;
  padding:4px 9px; border-radius:var(--rs);
  border:1px solid transparent; cursor:pointer;
  transition:all var(--tr); text-decoration:none;
  white-space:nowrap; line-height:1.4;
}
.btn:disabled { opacity:.4; cursor:default; pointer-events:none; }
.btn-op  { background:var(--acd);  color:var(--ac);  border-color:rgba(192,132,252,.2); }
.btn-op:hover  { background:rgba(192,132,252,.22); border-color:rgba(192,132,252,.38); }
.btn-go  { background:var(--rund); color:var(--run); border-color:rgba(52,211,153,.2); }
.btn-go:hover  { background:rgba(52,211,153,.2); }
.btn-st  { background:rgba(248,113,113,.10); color:var(--err); border-color:rgba(248,113,113,.2); }
.btn-st:hover  { background:rgba(248,113,113,.2); }
.btn-ic  { background:var(--bge); color:var(--txm); border-color:var(--bd); padding:4px 7px; }
.btn-ic:hover  { color:var(--tx); border-color:var(--bdh); }
.btn-mc  { background:rgba(251,191,36,.08); color:var(--warn); border-color:rgba(251,191,36,.18); cursor:default; pointer-events:none; }

/* Modal */
.overlay {
  position:fixed; inset:0;
  background:rgba(0,0,0,.72); backdrop-filter:blur(4px);
  z-index:200;
  display:flex; align-items:center; justify-content:center;
  opacity:0; visibility:hidden; transition:all .2s ease;
}
.overlay.open { opacity:1; visibility:visible; }
.modal {
  background:var(--bgc); border:1px solid var(--bd);
  border-radius:var(--r); padding:22px;
  max-width:400px; width:90%;
  transform:scale(.96); transition:transform .2s ease;
  position:relative;
}
.overlay.open .modal { transform:scale(1); }
.modal-title {
  font-family:'Syne',sans-serif; font-size:15px; font-weight:700;
  color:var(--tx); margin-bottom:14px;
}
.modal-x {
  position:absolute; top:14px; right:14px;
  width:26px; height:26px; border-radius:5px;
  border:1px solid var(--bd); background:transparent;
  color:var(--txm); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-size:12px; transition:all var(--tr);
}
.modal-x:hover { background:var(--bge); color:var(--tx); }
#qr-img { display:block; max-width:190px; margin:0 auto; border-radius:var(--rs); }
#qr-url {
  font-family:'JetBrains Mono',monospace; font-size:11px;
  color:var(--tx2); text-align:center; margin-top:10px; word-break:break-all;
}
.gtbl { font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--tx2); }
.grow { display:flex; gap:10px; padding:6px 0; border-bottom:1px solid var(--bd); }
.grow:last-child { border-bottom:none; }
.gkey { color:var(--txm); min-width:70px; flex-shrink:0; }

/* Toast */
.toasts { position:fixed; bottom:18px; right:18px; z-index:300; display:flex; flex-direction:column; gap:7px; }
.toast {
  background:var(--bge); border:1px solid var(--bd);
  border-radius:var(--rs); padding:9px 13px;
  font-size:12.5px; color:var(--tx); max-width:280px;
  box-shadow:0 4px 20px rgba(0,0,0,.4);
  animation:tin .18s ease;
}
.toast.ok  { border-left:3px solid var(--run); }
.toast.err { border-left:3px solid var(--err); }
.toast.inf { border-left:3px solid var(--ac); }
@keyframes tin { from{transform:translateX(16px);opacity:0} to{transform:none;opacity:1} }

/* Stagger */
.card:nth-child(1){animation-delay:.03s} .card:nth-child(2){animation-delay:.06s}
.card:nth-child(3){animation-delay:.09s} .card:nth-child(4){animation-delay:.12s}
.card:nth-child(5){animation-delay:.15s} .card:nth-child(6){animation-delay:.18s}
.card:nth-child(7){animation-delay:.21s} .card:nth-child(8){animation-delay:.24s}
.card:nth-child(9){animation-delay:.27s} .card:nth-child(10){animation-delay:.30s}
.card:nth-child(n+11){animation-delay:.33s}

@media(max-width:720px){
  .hdr-stats{display:none}
  .main{padding:12px}
  .svgrid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="hdr">
  <a class="logo" href="#">
    <span class="logo-icon">&#x1F409;</span>
    <span class="logo-text">Dragon<em>suite</em></span>
  </a>
  <div class="sep"></div>
  <div class="hdr-stats">
    <div class="schip">
      <span class="slbl">VRAM</span>
      <div class="strack"><div class="sfill" id="h-vram-bar" style="width:0%"></div></div>
      <span class="sval" id="h-vram-val">&#8212;</span>
    </div>
    <div class="schip">
      <span class="slbl">GPU</span>
      <div class="strack"><div class="sfill" id="h-gpu-bar" style="width:0%"></div></div>
      <span class="sval" id="h-gpu-val">&#8212;</span>
    </div>
    <div class="schip">
      <span class="slbl">CPU</span>
      <div class="strack"><div class="sfill" id="h-cpu-bar" style="width:0%"></div></div>
      <span class="sval" id="h-cpu-val">&#8212;</span>
    </div>
    <div class="schip">
      <span class="slbl">RAM</span>
      <div class="strack"><div class="sfill" id="h-ram-bar" style="width:0%"></div></div>
      <span class="sval" id="h-ram-val">&#8212;</span>
    </div>
    <div class="schip">
      <span class="slbl">DISK</span>
      <div class="strack"><div class="sfill" id="h-disk-bar" style="width:0%"></div></div>
      <span class="sval" id="h-disk-val">&#8212;</span>
    </div>
  </div>
  <div class="hdr-weather" id="hdr-weather" title="KPSM · Portsmouth NH">
    <img id="hdr-weather-icon" src="" alt="" style="display:none">
    <span class="hdr-weather-temp" id="hdr-weather-temp">&#8230;</span>
    <span class="hdr-weather-cond" id="hdr-weather-cond"></span>
  </div>
  <div class="hdr-right">
    <span class="hdr-ip" id="hdr-ip">&#8212;</span>
    <button class="ibtn" id="refresh-btn" title="Refresh">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
        <path d="M21 3v5h-5"/>
        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
        <path d="M8 16H3v5"/>
      </svg>
    </button>
    <button class="ibtn" id="theme-btn" title="Toggle theme">&#9728;&#65039;</button>
  </div>
</header>

<nav class="cnav" id="cnav">
  <button class="ctab active" data-cat="all">All <span class="cnum" id="cnt-all">0</span></button>
</nav>

<main class="main">
  <div class="sgrid">
    <div class="sc">
      <div class="sc-lbl">VRAM Usage</div>
      <div class="sc-val" id="sc-vram-val">&#8212; GB</div>
      <div class="sc-bar"><div class="sc-fill" id="sc-vram-bar" style="width:0%"></div></div>
      <div class="sc-sub" id="sc-vram-sub">Loading&#8230;</div>
    </div>
    <div class="sc">
      <div class="sc-lbl">GPU Utilization</div>
      <div class="sc-val" id="sc-gpu-val">&#8212;%</div>
      <div class="sc-bar"><div class="sc-fill" id="sc-gpu-bar" style="width:0%"></div></div>
      <div class="sc-sub" id="sc-gpu-sub">&#8212;&#176;C</div>
    </div>
    <div class="sc">
      <div class="sc-lbl">CPU + RAM</div>
      <div class="sc-val" id="sc-cpu-val">&#8212;%</div>
      <div class="sc-bar"><div class="sc-fill" id="sc-cpu-bar" style="width:0%"></div></div>
      <div class="sc-sub" id="sc-ram-sub">RAM &#8212;</div>
    </div>
    <div class="sc">
      <div class="sc-lbl">Disk &middot; Projects SSD</div>
      <div class="sc-val" id="sc-disk-val">&#8212; GB</div>
      <div class="sc-bar"><div class="sc-fill" id="sc-disk-bar" style="width:0%"></div></div>
      <div class="sc-sub" id="sc-disk-sub">Loading&#8230;</div>
    </div>
  </div>

  <div class="llmrow">
    <span class="llm-lbl">Ollama</span>
    <div class="llm-pills" id="ollama-models"><span class="llm-off">Not running</span></div>
    <div class="sep" style="height:18px;flex-shrink:0"></div>
    <span class="llm-lbl">LM Studio</span>
    <div class="llm-pills" id="lms-models"><span class="llm-off">Not running</span></div>
  </div>

  <div class="svgrid" id="svgrid">
    <div style="color:var(--txm);padding:40px;text-align:center;grid-column:1/-1">Loading&#8230;</div>
  </div>
</main>

<div class="overlay" id="qr-overlay">
  <div class="modal">
    <button class="modal-x" id="qr-close">&#x2715;</button>
    <div class="modal-title" id="qr-title">QR Code</div>
    <img id="qr-img" src="" alt="QR Code">
    <div id="qr-url"></div>
  </div>
</div>

<div class="overlay" id="git-overlay">
  <div class="modal">
    <button class="modal-x" id="git-close">&#x2715;</button>
    <div class="modal-title" id="git-title">Git Info</div>
    <div class="gtbl" id="git-content"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
'use strict';

var services = [];
var activeCat = 'all';

var CAT = {
  image:        {bg:'rgba(168,85,247,.13)',  cl:'#a855f7', bd:'rgba(168,85,247,.25)'},
  video:        {bg:'rgba(96,165,250,.13)',  cl:'#60a5fa', bd:'rgba(96,165,250,.25)'},
  audio:        {bg:'rgba(244,114,182,.13)', cl:'#f472b6', bd:'rgba(244,114,182,.25)'},
  segmentation: {bg:'rgba(45,212,191,.13)',  cl:'#2dd4bf', bd:'rgba(45,212,191,.25)'},
  '3d':         {bg:'rgba(251,146,60,.13)',  cl:'#fb923c', bd:'rgba(251,146,60,.25)'},
  game:         {bg:'rgba(74,222,128,.13)',  cl:'#4ade80', bd:'rgba(74,222,128,.25)'},
  'smart-home': {bg:'rgba(249,115,22,.13)',  cl:'#f97316', bd:'rgba(249,115,22,.25)'},
  automation:   {bg:'rgba(148,163,184,.10)', cl:'#94a3b8', bd:'rgba(148,163,184,.20)'},
  llm:          {bg:'rgba(244,63,94,.13)',   cl:'#f43f5e', bd:'rgba(244,63,94,.25)'}
};

function catStyle(c) {
  var s = CAT[c] || CAT.automation;
  return 'background:' + s.bg + ';color:' + s.cl + ';border:1px solid ' + s.bd;
}

function toast(msg, type, ms) {
  var el = document.createElement('div');
  el.className = 'toast ' + (type || 'inf');
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(function(){ el.remove(); }, ms || 3000);
}

function fcls(p) { return p >= 85 ? 'd' : p >= 65 ? 'w' : ''; }

function setHBar(id, pct) {
  var el = document.getElementById(id);
  if (!el) return;
  el.style.width = Math.min(100, pct) + '%';
  el.className = 'sfill ' + fcls(pct);
}

function setSBar(id, pct) {
  var el = document.getElementById(id);
  if (!el) return;
  el.style.width = Math.min(100, pct) + '%';
  el.className = 'sc-fill ' + fcls(pct);
}

function txt(id, v) { var el = document.getElementById(id); if (el) el.textContent = v; }

async function fetchGpu() {
  try {
    var d = await fetch('/api/gpu-stats').then(function(r){ return r.json(); });
    if (d.error) return;
    var pct = Math.round(d.vram_percent);
    var used = (d.vram_used_mb / 1024).toFixed(1);
    var total = (d.vram_total_mb / 1024).toFixed(1);
    setHBar('h-vram-bar', pct); txt('h-vram-val', used + 'G');
    setHBar('h-gpu-bar', d.gpu_utilization); txt('h-gpu-val', d.gpu_utilization + '%');
    txt('sc-vram-val', used + ' GB');
    setSBar('sc-vram-bar', pct);
    txt('sc-vram-sub', used + ' / ' + total + ' GB (' + pct + '%)');
    txt('sc-gpu-val', d.gpu_utilization + '%');
    setSBar('sc-gpu-bar', d.gpu_utilization);
    txt('sc-gpu-sub', d.gpu_temp + '\u00b0C');
  } catch(_) {}
}

async function fetchSys() {
  try {
    var d = await fetch('/api/system-stats').then(function(r){ return r.json(); });
    if (d.error) return;
    setHBar('h-cpu-bar', d.cpu_percent); txt('h-cpu-val', Math.round(d.cpu_percent) + '%');
    setHBar('h-ram-bar', d.ram_percent); txt('h-ram-val', d.ram_used_gb + 'G');
    setHBar('h-disk-bar', d.disk_percent); txt('h-disk-val', d.disk_used_gb + 'G');
    txt('sc-cpu-val', Math.round(d.cpu_percent) + '%');
    setSBar('sc-cpu-bar', d.cpu_percent);
    txt('sc-ram-sub', 'RAM ' + d.ram_used_gb + ' / ' + d.ram_total_gb + ' GB');
    txt('sc-disk-val', d.disk_used_gb + ' GB');
    setSBar('sc-disk-bar', d.disk_percent);
    txt('sc-disk-sub', d.disk_used_gb + ' / ' + d.disk_total_gb + ' GB (' + Math.round(d.disk_percent) + '%)');
  } catch(_) {}
}

async function fetchLlm() {
  try {
    var d = await fetch('/api/llm-models').then(function(r){ return r.json(); });
    var oel = document.getElementById('ollama-models');
    oel.innerHTML = (d.ollama && d.ollama.length)
      ? d.ollama.map(function(m){ return '<span class="llm-pill">' + m.name + ' <span style="color:var(--txm)">' + m.size_gb + 'G</span></span>'; }).join('')
      : '<span class="llm-off">Not running</span>';
    var lel = document.getElementById('lms-models');
    lel.innerHTML = (d.lmstudio && d.lmstudio.length)
      ? d.lmstudio.map(function(m){ return '<span class="llm-pill">' + m + '</span>'; }).join('')
      : '<span class="llm-off">Not running</span>';
  } catch(_) {}
}

function buildNav(svcs, cats) {
  var counts = {all: svcs.length};
  svcs.forEach(function(s){ counts[s.category] = (counts[s.category] || 0) + 1; });
  var used = Object.keys(cats).filter(function(c){ return counts[c]; });
  var nav = document.getElementById('cnav');
  nav.innerHTML =
    '<button class="ctab' + (activeCat === 'all' ? ' active' : '') + '" data-cat="all">All <span class="cnum">' + counts.all + '</span></button>' +
    used.map(function(c){
      return '<button class="ctab' + (activeCat === c ? ' active' : '') + '" data-cat="' + c + '">' +
        cats[c].name + ' <span class="cnum">' + (counts[c] || 0) + '</span></button>';
    }).join('');
  nav.querySelectorAll('.ctab').forEach(function(btn){
    btn.addEventListener('click', function(){
      activeCat = btn.dataset.cat;
      nav.querySelectorAll('.ctab').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      renderGrid();
    });
  });
}

function buildCard(s) {
  var running = s.running;
  var hasPort = s.port && s.url;
  var hasCmd  = s.launch_command && s.launch_command !== 'null';
  var cat     = s.category || 'automation';
  var catLbl  = cat.replace(/-/g, ' ');
  var port    = s.port ? ':' + s.port : 'mcp-only';

  var btns = '';
  if (!hasPort && !hasCmd && !s.always_on) {
    btns = '<span class="btn btn-mc">MCP Only</span>';
  } else if (s.always_on) {
    if (s.url) btns += '<a class="btn btn-op" href="' + s.url + '" target="_blank">\u2197 Open</a>';
    if (s.url) btns += '<button class="btn btn-ic" title="QR Code" onclick="showQr(\'' + s.id + '\',\'' + s.url + '\')">&#x25A6;</button>';
  } else {
    if (running && hasPort) btns += '<a class="btn btn-op" href="' + s.url + '" target="_blank">\u2197 Open</a>';
    if (running)            btns += '<button class="btn btn-st" onclick="stopSvc(\'' + s.id + '\')">\u25a0 Stop</button>';
    else if (hasCmd)        btns += '<button class="btn btn-go" onclick="startSvc(\'' + s.id + '\')">\u25b6 Start</button>';
    if (hasPort)            btns += '<button class="btn btn-ic" title="QR Code" onclick="showQr(\'' + s.id + '\',\'' + s.url + '\')">&#x25A6;</button>';
    if (s.project_path)     btns += '<button class="btn btn-ic" title="Git info" onclick="showGit(\'' + s.id + '\',\'' + s.name.replace(/'/g, '\\x27') + '\')">&#x2387;</button>';
    if (s.github_url)       btns += '<a class="btn btn-ic" href="' + s.github_url + '" target="_blank" title="GitHub">&#x2325;</a>';
  }

  var feats = (s.features || []).map(function(f){ return '<span class="feat">' + f + '</span>'; }).join('');

  return '<div class="card' + (running ? ' run' : '') + '" data-id="' + s.id + '" data-cat="' + cat + '">' +
    '<div class="card-hd">' +
      '<div class="card-ico">' + (s.icon || '&#x2699;') + '</div>' +
      '<div class="card-meta">' +
        '<div class="card-name">' + s.name + '</div>' +
        '<span class="cbadge" style="' + catStyle(cat) + '">' + catLbl + '</span>' +
      '</div>' +
      '<div class="sdot ' + (running ? 'on' : 'off') + '"></div>' +
    '</div>' +
    '<div class="card-desc">' + (s.description || '') + '</div>' +
    (feats ? '<div class="card-feats">' + feats + '</div>' : '') +
    '<div class="card-ft">' +
      '<span class="cport">PORT <b>' + port + '</b></span>' +
      btns +
    '</div>' +
  '</div>';
}

function renderGrid() {
  var grid = document.getElementById('svgrid');
  var list = activeCat === 'all' ? services : services.filter(function(s){ return s.category === activeCat; });
  if (!list.length) {
    grid.innerHTML = '<div style="color:var(--txm);padding:40px;text-align:center;grid-column:1/-1">No services in this category</div>';
    return;
  }
  grid.innerHTML = list.map(buildCard).join('');
  // Only animate cards on the very first render; suppress on status polls
  setTimeout(function(){ grid.classList.add('settled'); }, 600);
}

async function fetchStatus(showMsg) {
  var btn = document.getElementById('refresh-btn');
  btn.classList.add('spin');
  try {
    var res = await Promise.all([fetch('/api/status'), fetch('/api/config')]);
    var status = await res[0].json();
    var cfg    = await res[1].json();
    txt('hdr-ip', status.local_ip);
    services = status.services;
    buildNav(services, cfg.categories || {});
    renderGrid();
    if (showMsg) toast('Refreshed', 'ok', 2000);
  } catch(_) {
    if (showMsg) toast('Failed to fetch status', 'err');
  } finally {
    btn.classList.remove('spin');
  }
}

async function startSvc(id) {
  var card = document.querySelector('[data-id="' + id + '"]');
  var btn  = card && card.querySelector('.btn-go');
  if (btn) { btn.disabled = true; btn.textContent = '\u2026'; }
  try {
    var d = await fetch('/api/start/' + id, {method:'POST'}).then(function(r){ return r.json(); });
    toast(d.message, d.status === 'started' ? 'ok' : 'inf');
    setTimeout(fetchStatus, 3000);
  } catch(_) {
    toast('Failed to start', 'err');
    if (btn) { btn.disabled = false; btn.textContent = '\u25b6 Start'; }
  }
}

async function stopSvc(id) {
  var card = document.querySelector('[data-id="' + id + '"]');
  var btn  = card && card.querySelector('.btn-st');
  if (btn) { btn.disabled = true; btn.textContent = '\u2026'; }
  try {
    var d = await fetch('/api/stop/' + id, {method:'POST'}).then(function(r){ return r.json(); });
    toast(d.message, 'inf');
    setTimeout(fetchStatus, 1500);
  } catch(_) {
    toast('Failed to stop', 'err');
    if (btn) { btn.disabled = false; btn.textContent = '\u25a0 Stop'; }
  }
}

function showQr(id, url) {
  document.getElementById('qr-title').textContent = 'QR Code';
  document.getElementById('qr-img').src = '/api/qrcode/' + id;
  document.getElementById('qr-url').textContent = url;
  document.getElementById('qr-overlay').classList.add('open');
}

async function showGit(id, name) {
  document.getElementById('git-title').textContent = name + ' \u2014 Git';
  document.getElementById('git-content').innerHTML = '<div style="color:var(--txm)">Loading\u2026</div>';
  document.getElementById('git-overlay').classList.add('open');
  try {
    var d = await fetch('/api/git/' + id).then(function(r){ return r.json(); });
    var g = d.git;
    if (!g) {
      document.getElementById('git-content').innerHTML = '<div style="color:var(--txm)">' + (d.message || 'No git info') + '</div>';
      return;
    }
    document.getElementById('git-content').innerHTML =
      '<div class="grow"><span class="gkey">Branch</span><span>' + g.branch + '</span></div>' +
      '<div class="grow"><span class="gkey">Commit</span><span>' + g.hash + '</span></div>' +
      '<div class="grow"><span class="gkey">Last</span><span>' + g.last_commit + '</span></div>';
  } catch(_) {
    document.getElementById('git-content').innerHTML = '<div style="color:var(--txm)">Error loading</div>';
  }
}

document.getElementById('qr-close').addEventListener('click', function(){ document.getElementById('qr-overlay').classList.remove('open'); });
document.getElementById('git-close').addEventListener('click', function(){ document.getElementById('git-overlay').classList.remove('open'); });
['qr-overlay','git-overlay'].forEach(function(id){
  document.getElementById(id).addEventListener('click', function(e){
    if (e.target === e.currentTarget) e.currentTarget.classList.remove('open');
  });
});

var themeBtn = document.getElementById('theme-btn');
var dark = localStorage.getItem('ds-theme') !== 'light';
function applyTheme() {
  document.body.classList.toggle('light', !dark);
  themeBtn.textContent = dark ? '\u2600\ufe0f' : '\uD83C\uDF19';
}
themeBtn.addEventListener('click', function(){
  dark = !dark;
  localStorage.setItem('ds-theme', dark ? 'dark' : 'light');
  applyTheme();
});

document.getElementById('refresh-btn').addEventListener('click', function(){ fetchStatus(true); });

// ── Weather (NWS KPSM · Portsmouth NH) ─────────────────────────────────
function cToF(c) { return (c !== null && c !== undefined) ? Math.round(c * 9/5 + 32) : null; }
function msToMph(ms) { return (ms !== null && ms !== undefined) ? Math.round(ms * 2.23694) : null; }
function degToCompass(d) {
  if (d === null || d === undefined) return '';
  return ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round(d / 22.5) % 16];
}
async function fetchWeather() {
  try {
    var resp = await fetch('https://api.weather.gov/stations/KPSM/observations/latest',
      { headers: { 'User-Agent': 'Dragonsuite/3.0 (personal dashboard; Portsmouth NH)' } });
    if (!resp.ok) throw new Error('NWS ' + resp.status);
    var p = (await resp.json()).properties;
    var tempF = cToF(p.temperature?.value);
    var mph   = msToMph(p.windSpeed?.value);
    var dir   = degToCompass(p.windDirection?.value);
    var icon  = document.getElementById('hdr-weather-icon');
    var tempEl = document.getElementById('hdr-weather-temp');
    var condEl = document.getElementById('hdr-weather-cond');
    if (p.icon) { icon.src = p.icon; icon.style.display = ''; }
    tempEl.textContent = tempF !== null ? tempF + '\u00b0F' : '--\u00b0F';
    var cond = p.textDescription || '';
    var wind = (mph !== null && dir) ? dir + ' ' + mph + ' mph' : '';
    condEl.textContent = [cond, wind].filter(Boolean).join(' \u00b7 ');
    document.getElementById('hdr-weather').title = 'KPSM \u00b7 Portsmouth NH \u00b7 Updated ' +
      new Date(p.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  } catch(e) {
    document.getElementById('hdr-weather-temp').textContent = '\u26a0\ufe0f';
    document.getElementById('hdr-weather-cond').textContent = 'unavailable';
    console.warn('Weather:', e);
  }
}

applyTheme();
fetchStatus();
fetchGpu();
fetchSys();
fetchLlm();
fetchWeather();
setInterval(fetchStatus,   30000);
setInterval(fetchGpu,       5000);
setInterval(fetchSys,      10000);
setInterval(fetchLlm,      60000);
setInterval(fetchWeather, 900000); // 15 min
</script>
