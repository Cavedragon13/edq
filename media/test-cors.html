<!DOCTYPE html>
<html>
<head>
    <title>LM Studio CORS Test</title>
</head>
<body>
    <h1>LM Studio CORS Test</h1>
    <button onclick="testCORS()">Test LM Studio Connection</button>
    <pre id="result"></pre>

    <script>
    async function testCORS() {
        const output = document.getElementById('result');
        output.textContent = 'Testing...';

        try {
            const response = await fetch('http://localhost:1234/v1/models', {
                method: 'GET',
                headers: { 'Accept': 'application/json' },
                mode: 'cors'
            });

            output.textContent = `✓ SUCCESS!\nStatus: ${response.status}\n\n` +
                                await response.text();
        } catch (error) {
            output.textContent = `✗ FAILED!\n${error}\n\nIf you see CORS error, start the server in LM Studio GUI.`;
        }
    }
    </script>
</body>
</html>
