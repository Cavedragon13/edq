<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mira Scene</title>
<script>
  try { document.documentElement.dataset.theme = localStorage.getItem('mira-theme') || 'dark'; } catch (e) {}
</script>
<script type="module" src="https://cdnjs.cloudflare.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js" integrity="sha384-cprcVQt7wbUl0xngF3PGP6yBB7n4/t+4AoAMG9biiMCGFiWOdzUH10Ie2COTqFNW" crossorigin="anonymous"></script>
<style>
  :root { --bg:#f4f4f5; --panel:#fff; --text:#1f2937; --muted:#6b7280; --border:#d1d5db; --accent:#3b82f6; --ok:#16a34a; --bad:#dc2626; }
  [data-theme="dark"] { --bg:#1e1e1e; --panel:#2d2d2d; --text:#e0e0e0; --muted:#9ca3af; --border:#4a5568; --accent:#60a5fa; --ok:#4ade80; --bad:#f87171; }
  [hidden] { display:none !important; }
  * { box-sizing:border-box; transition:background-color .3s ease,color .3s ease,border-color .3s ease; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,sans-serif; }
  header { display:flex; justify-content:space-between; align-items:center; padding:14px 24px; border-bottom:1px solid var(--border); }
  h1 { margin:0; font-size:20px; } h2 { font-size:16px; margin:0 0 10px; }
  main { max-width:1100px; margin:0 auto; padding:20px 16px 60px; display:grid; gap:16px; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px; }
  button, .btn { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:8px 14px; cursor:pointer; font:inherit; text-decoration:none; display:inline-block; }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--border); }
  button:disabled { opacity:.5; cursor:default; }
  #theme { width:38px; height:38px; border-radius:50%; padding:0; font-size:18px; }
  #theme:hover { transform:rotate(25deg); }
  input[type=file] { color:var(--text); }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .stages { display:flex; gap:6px; flex-wrap:wrap; margin:10px 0; }
  .stage { padding:3px 10px; border-radius:99px; border:1px solid var(--border); color:var(--muted); font-size:13px; }
  .stage.done { color:var(--ok); border-color:var(--ok); } .stage.running { color:var(--accent); border-color:var(--accent); }
  model-viewer { width:100%; height:480px; background:var(--bg); border-radius:8px; }
  img.env { width:100%; border-radius:8px; }
  pre { background:var(--bg); border:1px solid var(--border); padding:10px; border-radius:6px; max-height:180px; overflow:auto; font-size:12px; white-space:pre-wrap; }
  .jobs { display:grid; gap:6px; } .job { display:flex; justify-content:space-between; gap:10px; padding:8px 10px; border:1px solid var(--border); border-radius:6px; cursor:pointer; }
  .job:hover { border-color:var(--accent); } .muted { color:var(--muted); } .bad { color:var(--bad); } .ok { color:var(--ok); }
  .links a { color:var(--accent); margin-right:14px; }
  .objects { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
</style>
</head>
<body>
<header><h1>Mira Scene <span class="muted" style="font-size:13px">single image → 3D scene</span></h1>
  <button id="theme" class="ghost" title="Toggle dark / light" aria-label="Toggle theme">☾</button></header>
<main>
  <section class="panel">
    <h2>New scene</h2>
    <div class="row"><input id="file" type="file" accept="image/png,image/jpeg,image/webp">
      <button id="go">Reconstruct scene</button><span id="msg" class="muted"></span></div>
    <p class="muted" style="margin:8px 0 0">Runs the full Mira pipeline: SAM3 + Gemini scene graph, depth, canonical coordinate maps, per-object meshes, floor, gravity-aware assembly, environment panorama. Takes several minutes per scene; one at a time.</p>
  </section>
  <section class="panel" id="current" hidden>
    <div class="row" style="justify-content:space-between"><h2 id="title"></h2>
      <span><button id="cancel" class="ghost">Cancel</button></span></div>
    <div id="status"></div><div class="stages" id="stages"></div>
    <div id="result"></div>
    <details><summary class="muted">Log</summary><pre id="log"></pre></details>
  </section>
  <section class="panel"><h2>Recent scenes</h2><div class="jobs" id="jobs"></div></section>
</main>
<script>
const $ = id => document.getElementById(id);
let current = null, timer = null;
const themeBtn = $('theme');
const paintTheme = () => themeBtn.textContent = document.documentElement.dataset.theme === 'dark' ? '☾' : '☀';
themeBtn.onclick = () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('mira-theme', next); } catch (e) {}
  paintTheme();
};
paintTheme();

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || r.statusText);
  return j;
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function refreshJobs() {
  const { jobs } = await api('/api/jobs');
  $('jobs').innerHTML = jobs.length ? jobs.map(j => `<div class="job" data-id="${esc(j.id)}">
    <span>${esc(j.input || j.id)} <span class="muted">${esc(j.started_at)}</span></span>
    <span class="${j.status === 'done' ? 'ok' : j.status === 'failed' ? 'bad' : 'muted'}">${esc(j.status)} ${j.stages_done}/${j.stages_total}</span></div>`).join('')
    : '<span class="muted">No scenes yet.</span>';
  document.querySelectorAll('.job').forEach(el => el.onclick = () => select(el.dataset.id));
}

async function select(id) {
  current = id; clearTimeout(timer); await poll();
}
let viewedUrl = null;
async function poll() {
  if (!current) return;
  let j;
  try { j = await api('/api/jobs/' + current); } catch (e) { $('status').textContent = e.message; return; }
  $('current').hidden = false;
  $('title').textContent = j.input || j.id;
  $('status').innerHTML = `<b class="${j.status === 'done' ? 'ok' : j.status === 'failed' ? 'bad' : ''}">${esc(j.status)}</b> <span class="muted">${esc(j.started_at)}${j.finished_at ? ' → ' + esc(j.finished_at) : ''}</span>`;
  $('stages').innerHTML = j.stages.map(s => `<span class="stage ${s.state}">${esc(s.name)}</span>`).join('');
  $('cancel').hidden = j.status !== 'running';
  $('log').textContent = j.log_tail;
  const scene = j.files.find(f => f.key === 'scene_with_floor') || j.files.find(f => f.key === 'scene');
  const env = j.files.find(f => f.key === 'environment');
  if (scene || env) {
    const key = (scene ? scene.url : '') + (env ? env.url : '') + j.objects.length;
    if (key !== viewedUrl) {
      viewedUrl = key;
      $('result').innerHTML =
        (scene ? `<model-viewer src="${scene.url}" camera-controls auto-rotate shadow-intensity="1" exposure="1"></model-viewer>` : '') +
        (env ? `<h2 style="margin-top:14px">Environment panorama</h2><img class="env" src="${env.url}" alt="environment">` : '') +
        `<div class="links" style="margin-top:10px">${j.files.map(f => `<a href="${f.url}" download>${esc(f.label)}</a>`).join('')}</div>` +
        (j.objects.length ? `<div class="objects">${j.objects.map(o => `<a class="btn ghost" href="${o.url}" download>${esc(o.name)}</a>`).join('')}</div>` : '');
    }
  } else { $('result').innerHTML = ''; viewedUrl = null; }
  refreshJobs();
  if (j.status === 'running') timer = setTimeout(poll, 4000);
}

$('go').onclick = async () => {
  const f = $('file').files[0];
  if (!f) { $('msg').textContent = 'Choose an image first.'; return; }
  const fd = new FormData(); fd.append('image', f);
  $('go').disabled = true; $('msg').textContent = 'Uploading…';
  try { const j = await api('/api/jobs', { method: 'POST', body: fd }); $('msg').textContent = ''; viewedUrl = null; select(j.job); }
  catch (e) { $('msg').textContent = e.message; $('msg').className = 'bad'; }
  $('go').disabled = false;
};
$('cancel').onclick = async () => { if (current) { await api(`/api/jobs/${current}/cancel`, { method: 'POST' }); poll(); } };
refreshJobs();
api('/api/jobs').then(({ jobs }) => { if (jobs.length) select(jobs[0].id); });
</script>
</body>
</html>
