<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragonsight 4 - Uncensored Vision AI</title>
    <link rel="icon" type="image/svg+xml" href="/media/favicon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            transition: background 0.3s ease;
        }

        body.dark-mode {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        body.dark-mode .container {
            background: #1e1e1e;
            color: #e0e0e0;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
        }

        body.dark-mode .header {
            background: linear-gradient(135deg, #2d2d44 0%, #1f2937 100%);
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            background: rgba(255,255,255,0.3);
            transform: rotate(180deg);
        }

        .content {
            padding: 30px;
        }

        .drop-zone {
            border: 3px dashed #667eea;
            border-radius: 12px;
            padding: 60px 20px;
            text-align: center;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        body.dark-mode .drop-zone {
            background: #2d2d2d;
            border-color: #4a5568;
        }

        .drop-zone:hover, .drop-zone.drag-over {
            background: #e8ebff;
            border-color: #764ba2;
            transform: scale(1.02);
        }

        body.dark-mode .drop-zone:hover,
        body.dark-mode .drop-zone.drag-over {
            background: #3d3d3d;
            border-color: #667eea;
        }

        .drop-zone.has-image {
            padding: 20px;
        }

        .drop-zone img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        select, button {
            padding: 12px 20px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        select {
            background: white;
        }

        body.dark-mode select {
            background: #2d2d2d;
            color: #e0e0e0;
            border-color: #4a5568;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            font-weight: 600;
        }

        body.dark-mode button {
            background: linear-gradient(135deg, #4a5568 0%, #374151 100%);
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .output-box {
            margin-bottom: 20px;
        }

        .output-box label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        body.dark-mode .output-box label {
            color: #e0e0e0;
        }

        .copy-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: #059669;
            transform: scale(1.05);
        }

        .copy-btn.copied {
            background: #22c55e;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            transition: border-color 0.2s;
        }

        body.dark-mode textarea {
            background: #2d2d2d;
            color: #e0e0e0;
            border-color: #4a5568;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        body.dark-mode textarea:focus {
            border-color: #818cf8;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
            font-weight: 600;
        }

        .error {
            background: #fee2e2;
            border: 2px solid #ef4444;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .success {
            background: #d1fae5;
            border: 2px solid #10b981;
            color: #065f46;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .controls {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="theme-toggle" id="themeToggle" title="Toggle dark mode">🌙</button>
            <h1>🐉 Dragonsight 4</h1>
            <p>Uncensored Vision AI - Image Description + Smart Naming</p>
            <p style="font-size: 0.9em; margin-top: 10px;">Drag & drop, click, or press Ctrl+V to paste images</p>
        </div>

        <div class="content">
            <div id="errorBox" class="error hidden"></div>
            <div id="successBox" class="success hidden"></div>

            <div class="drop-zone" id="dropZone">
                <h3>📁 Drop Image Here or Click to Upload</h3>
                <p style="color: #6b7280; margin-top: 10px;">Supports: JPG, PNG, GIF, WebP | Or press Ctrl+V to paste</p>
                <input type="file" id="fileInput" accept="image/*" style="display: none;">
                <img id="preview" class="hidden" alt="Preview">
            </div>

            <div class="controls">
                <select id="backend">
                    <option value="ollama" selected>💎 Ollama (Always-on)</option>
                    <option value="lmstudio">🔥 LM Studio (Uncensored)</option>
                </select>
                <select id="ollamaModel">
                    <option value="qwen3-vl:8b" selected>Qwen3-VL 8B (Default)</option>
                    <option value="llama3.2-vision:11b">Llama 3.2 Vision 11B</option>
                </select>
                <button id="analyzeBtn" disabled>🔍 Analyze Image</button>
            </div>

            <div id="loadingBox" class="loading hidden">⏳ Analyzing image...</div>

            <div class="output-box">
                <label>
                    Detailed Description
                    <button class="copy-btn" data-target="detailedDesc">📋 Copy</button>
                </label>
                <textarea id="detailedDesc" rows="6" placeholder="Detailed description will appear here..." readonly></textarea>
            </div>

            <div class="output-box">
                <label>
                    Concise Description
                    <button class="copy-btn" data-target="conciseDesc">📋 Copy</button>
                </label>
                <textarea id="conciseDesc" rows="2" placeholder="One-line description..." readonly></textarea>
            </div>

            <div class="output-box">
                <label>
                    Tags/Keywords
                    <button class="copy-btn" data-target="tags">📋 Copy</button>
                </label>
                <textarea id="tags" rows="2" placeholder="Comma-separated tags..." readonly></textarea>
            </div>

            <div class="output-box">
                <label>
                    Suggested Filename
                    <button class="copy-btn" data-target="filename">📋 Copy</button>
                </label>
                <textarea id="filename" rows="1" placeholder="suggested_filename.jpg" readonly></textarea>
            </div>

            <button id="saveBtn" class="hidden" style="width: 100%; margin-top: 10px;">💾 Download Metadata JSON</button>
        </div>
    </div>

    <script src="/media/dragonsight4.js" defer></script>
</body>
</html>
